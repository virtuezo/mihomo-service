# config.yaml для MihomoService — кладётся рядом с MihomoService.exe.
#
# Достаточно заполнить proxies: служба сама соберёт из них fallback-группу PROXY
# (трафик идёт через первый доступный прокси по порядку списка), включит TUN
# и пустит весь трафик, кроме локальных сетей, через эту группу.
# Системный прокси не настраивается. Изменения подхватываются на лету.
#
# Любые другие ключи mihomo (rules, dns, tun.stack, ...) можно задать здесь —
# они переопределят значения по умолчанию. Всегда принудительно:
#   tun.enable / tun.auto-route / tun.auto-detect-interface = true, dns.enable = true, mode = rule.

# Необязательные настройки службы (ядру не передаются):
service:
  group-name: PROXY                              # имя fallback-группы
  test-url: https://www.gstatic.com/generate_204 # URL проверки доступности
  interval: 300                                  # период проверки, с
  timeout: 5000                                  # таймаут проверки, мс
  kill-switch: true   # без туннеля интернета нет: в сеть выходит только ядро (WFP-фильтры, действуют и без службы)
  allow-lan: true     # при kill-switch пропускать локальные сети (10/8, 172.16/12, 192.168/16, fc00::/7)

# Порядок важен: первый — основной, остальные — резервные.
proxies:
  - name: main
    type: vless
    server: main.example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: www.example.com
    reality-opts:
      public-key: SiPksS30e5VsFMKeKC_1tips4AmDXTYW3sXiAGZNZJw   # ключ сервера
      short-id: "0123abcd"
    client-fingerprint: chrome

  - name: backup
    type: ss
    server: backup.example.com
    port: 8388
    cipher: 2022-blake3-aes-128-gcm
    password: "aeWRGsWkMZoDAJ44uzVV2A=="   # ключ сервера (base64, 16 байт для aes-128)
    udp: true

# Можно добавить подписки — они тоже войдут в fallback-группу (после proxies):
# proxy-providers:
#   sub:
#     type: http
#     url: https://example.com/sub
#     interval: 3600
#     path: ./providers/sub.yaml
#     health-check: { enable: true, url: https://www.gstatic.com/generate_204, interval: 300 }

# Свои правила (если не заданы — локальные сети DIRECT, остальное MATCH,PROXY):
# rules:
#   - DOMAIN-SUFFIX,ru,DIRECT
#   - MATCH,PROXY
